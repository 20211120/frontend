<script>
/* ============ WGS84 -> GCJ02 坐标转换（浏览器定位为 WGS84，腾讯地图为 GCJ02） ============ */
const PI = Math.PI, A = 6378245.0, EE = 0.00669342162296594323;
function outOfChina(lat, lng) {
  return lng < 72.004 || lng > 137.8347 || lat < 0.8293 || lat > 55.8271;
}
function transformLat(x, y) {
  let ret = -100.0 + 2.0*x + 3.0*y + 0.2*y*y + 0.1*x*y + 0.2*Math.sqrt(Math.abs(x));
  ret += (20.0*Math.sin(6.0*x*PI) + 20.0*Math.sin(2.0*x*PI)) * 2.0/3.0;
  ret += (20.0*Math.sin(y*PI) + 40.0*Math.sin(y/3.0*PI)) * 2.0/3.0;
  ret += (160.0*Math.sin(y/12.0*PI) + 320*Math.sin(y*PI/30.0)) * 2.0/3.0;
  return ret;
}
function transformLng(x, y) {
  let ret = 300.0 + x + 2.0*y + 0.1*x*x + 0.1*x*y + 0.1*Math.sqrt(Math.abs(x));
  ret += (20.0*Math.sin(6.0*x*PI) + 20.0*Math.sin(2.0*x*PI)) * 2.0/3.0;
  ret += (20.0*Math.sin(x*PI) + 40.0*Math.sin(x/3.0*PI)) * 2.0/3.0;
  ret += (150.0*Math.sin(x/12.0*PI) + 300.0*Math.sin(x/30.0*PI)) * 2.0/3.0;
  return ret;
}
function wgs84ToGcj02(lat, lng) {
  if (outOfChina(lat, lng)) return [lat, lng];
  let dLat = transformLat(lng - 105.0, lat - 35.0);
  let dLng = transformLng(lng - 105.0, lat - 35.0);
  const radLat = lat / 180.0 * PI;
  let magic = Math.sin(radLat);
  magic = 1 - EE * magic * magic;
  const sqrtMagic = Math.sqrt(magic);
  dLat = (dLat * 180.0) / ((A * (1 - EE)) / (magic * sqrtMagic) * PI);
  dLng = (dLng * 180.0) / (A / sqrtMagic * Math.cos(radLat) * PI);
  return [lat + dLat, lng + dLng];
}

/* ============ 地图模块 ============ */
const CATS = [['', '全部'], ['library','图书馆'], ['teaching','教学楼'], ['canteen','食堂'],
              ['sports','体育'], ['dorm','宿舍'], ['other','其他']];
/* 所有地点图标统一为红色（品牌红） */
const CAT_COLOR = { library:'#e45656', teaching:'#e45656', canteen:'#e45656',
                    sports:'#e45656', dorm:'#e45656', other:'#e45656', classroom:'#e45656' };
const CAT_NAME = Object.fromEntries(CATS.slice(1));

let map, notesLayer, pois = [], mapNotes = [], currentPoi = null, activeCat = '', curTab = 'comment';
let roomIdMap = {}, routePolyline = null, startMarker = null, choosingStart = false, startPos = null;
let addingNote = false, notePos = null, currentNote = null;
let notePickMarker = null, myLocMarker = null, myLoc = null;
let singleMarker = null;   // 当前唯一高亮的地点图标（默认全隐藏，选中才显示）
let noteFocusMarker = null; // 点击备注后临时显示的定位图钉
let notePanel = null;      // 右侧详情面板当前展示的备注（POI 模式时为 null）

function markerIcon(color) {
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="26" height="34" viewBox="0 0 26 34">
    <path d="M13 1C6.9 1 2 5.9 2 12c0 8 11 21 11 21s11-13 11-21c0-6.1-4.9-11-11-11z"
      fill="${color}" stroke="#fff" stroke-width="1.5"/>
    <circle cx="13" cy="12" r="4" fill="#fff"/></svg>`;
  return 'data:image/svg+xml,' + encodeURIComponent(svg);
}

/* 我的位置：蓝色圆点（仿主流地图 App） */
function myLocIcon() {
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 22 22">
    <circle cx="11" cy="11" r="10" fill="#1e6fd9" fill-opacity="0.18"/>
    <circle cx="11" cy="11" r="6" fill="#1e6fd9" stroke="#fff" stroke-width="2.5"/></svg>`;
  return 'data:image/svg+xml,' + encodeURIComponent(svg);
}

function showMyLoc(pos) {
  myLoc = pos;
  if (myLocMarker) myLocMarker.setMap(null);
  myLocMarker = new TMap.MultiMarker({
    map, styles: { me: new TMap.MarkerStyle({ width: 22, height: 22,
      src: myLocIcon(), anchor: { x: 11, y: 11 } }) },
    geometries: [{ id: 'me', styleId: 'me', position: pos }],
  });
}

/* 标注选点：临时红色图钉，让用户看到自己选了哪里 */
function showNotePick(pos) {
  if (notePickMarker) notePickMarker.setMap(null);
  notePickMarker = new TMap.MultiMarker({
    map, styles: { pick: new TMap.MarkerStyle({ width: 30, height: 40,
      src: markerIcon('#e45656'), anchor: { x: 15, y: 40 } }) },
    geometries: [{ id: 'pick', styleId: 'pick', position: pos }],
  });
}
function clearNotePick() {
  if (notePickMarker) { notePickMarker.setMap(null); notePickMarker = null; }
}

function initMap() {
  map = new TMap.Map('map', { zoom: 16, center: new TMap.LatLng(31.9387, 118.7917) });
  map.on('click', e => {
    // 任意点备注模式优先
    if (addingNote) {
      addingNote = false;
      notePos = e.latLng;
      showNotePick(notePos);   // 立即在选中的位置打上图钉
      map.panBy([0, -180]);    // 地图内容下移，让图钉露出弹窗遮挡区
      document.getElementById('noteTip').style.display = 'none';
      document.getElementById('noteCoord').textContent =
        `已选中位置：${notePos.getLat().toFixed(5)}, ${notePos.getLng().toFixed(5)}`;
      document.getElementById('noteCreateModal').classList.add('open');
      return;
    }
    if (!choosingStart) return;
    startPos = e.latLng;
    choosingStart = false;
    document.getElementById('chooseTip').style.display = 'none';
    if (startMarker) startMarker.setMap(null);
    startMarker = new TMap.MultiMarker({
      map, styles: { s: new TMap.MarkerStyle({ width: 22, height: 22,
        src: markerIcon('#2e9e4f'), anchor: { x: 11, y: 11 } }) },
      geometries: [{ id: 'start', styleId: 's', position: startPos }],
    });
    if (currentPoi) doRoute(startPos, new TMap.LatLng(currentPoi.lat, currentPoi.lng));
  });
}

/* 默认不铺图标：只在选中某个地点时，点亮那一个地点的高亮图标（放大醒目） */
function highlightMarker(p) {
  if (singleMarker) { singleMarker.setMap(null); singleMarker = null; }
  if (!p || !p.lat || !p.lng) return;
  const color = CAT_COLOR[p.category] || '#e45656';
  singleMarker = new TMap.MultiMarker({
    map,
    styles: { hl: new TMap.MarkerStyle({ width: 34, height: 44,
      src: markerIcon(color), anchor: { x: 17, y: 44 } }) },
    geometries: [{ id: 'hl', styleId: 'hl',
      position: new TMap.LatLng(p.lat, p.lng) }],
  });
  singleMarker.on('click', () => openDetail(p.id));
}
function clearHighlightMarker() {
  if (singleMarker) { singleMarker.setMap(null); singleMarker = null; }
}

function renderPoiList(poiArr, noteArr) {
  const box = document.getElementById('poiList');
  const poiHtml = poiArr.map(p => {
    const s = p.stats;
    return `<div class="poi-item" onclick="openDetail(${p.id})">
      <div class="name">${esc(p.name)}</div>
      <div class="meta"><span>${CAT_NAME[p.category] || ''}</span>
        <span>评论 ${s.total}</span></div></div>`;
  }).join('');

/* 点击定位按钮：定位并在图上显示我的位置 */
async function locateMe() {
  const btn = document.getElementById('locateBtn');
  btn.style.opacity = '.45';
  const pos = await getMyLocation();
  btn.style.opacity = '1';
  if (!pos) {
    alert('定位失败：请检查浏览器定位权限（需要在 localhost 或 https 环境下才允许定位）');
    return;
  }
  showMyLoc(pos);
  map.setCenter(pos);

function getMyLocation() {
  return new Promise(resolve => {
    if (!navigator.geolocation) return resolve(null);
    navigator.geolocation.getCurrentPosition(
      p => {
        const [lat, lng] = wgs84ToGcj02(p.coords.latitude, p.coords.longitude);
        const pos = new TMap.LatLng(lat, lng);
        showMyLoc(pos);          // 定位成功即在图上标出我的位置
        resolve(pos);
      },
      () => resolve(null),
      { timeout: 6000, enableHighAccuracy: true });
  });
}

function doRoute(from, to) {
  const walking = new TMap.service.Walking({});
  walking.search({ from, to })
    .then(res => {
      const route = (res.result && res.result.routes && res.result.routes[0]) || res.routes[0];
      if (!route) throw new Error('未找到路线');
      // polyline 为压缩坐标：前两位为绝对值，之后为增量（×1e6）
      const coors = route.polyline.slice();
      for (let i = 2; i < coors.length; i++) coors[i] = coors[i - 2] + coors[i] / 1e6;
      const pl = [];
      for (let i = 0; i < coors.length; i += 2) pl.push(new TMap.LatLng(coors[i], coors[i + 1]));
      clearRoute(true);
      routePolyline = new TMap.MultiPolyline({
        map, styles: { line: new TMap.PolylineStyle({ color: '#1e6fd9', width: 6, borderWidth: 2,
          borderColor: '#fff', lineCap: 'round' }) },
        geometries: [{ id: 'route', styleId: 'line', paths: pl }],
      });
      const km = route.distance >= 1000 ? (route.distance / 1000).toFixed(2) + ' 公里'
                                        : route.distance + ' 米';
      document.getElementById('routeSummary').textContent =
        `步行约 ${km} · 预计 ${route.duration} 分钟 → ${currentPoi ? currentPoi.name : ''}`;
      document.getElementById('routeSteps').innerHTML =
        (route.steps || []).map((s, i) => `${i + 1}. ${s.instruction}`).join('<br>') ||
        '暂无分步指引';
      document.getElementById('routeInfo').style.display = 'block';
      map.easeTo({ bounds: boundsOf(pl) });
    })
    .catch(() => {
      /* 站内 Walking 路线服务需要腾讯密钥（代理占位符环境或未填 key 时必然失败）。
         降级：地图内绘制"直线参考路线"，展示直线距离与预估步行时间，不跳转、不报错。
         填了 TMAP_KEY 后此处不会再触发，会直接画出真实路网步行路线。 */
      drawStraightFallback(from, to);
    });
}

/* 无密钥时的站内兜底：起点→终点直线参考路线（虚线 + 距离/耗时估算） */
function drawStraightFallback(from, to) {
  clearRoute(true);
  routePolyline = new TMap.MultiPolyline({
    map, styles: { line: new TMap.PolylineStyle({ color: '#1e6fd9', width: 5,
      borderWidth: 2, borderColor: '#fff', lineCap: 'round' }) },
    geometries: [{ id: 'route', styleId: 'line', paths: [from, to] }],
  });
  // Haversine 球面直线距离（米）
  const R = 6371000, rad = d => d * Math.PI / 180;
  const dLat = rad(to.getLat() - from.getLat());
  const dLng = rad(to.getLng() - from.getLng());
  const a = Math.sin(dLat / 2) ** 2 +
      Math.cos(rad(from.getLat())) * Math.cos(rad(to.getLat())) * Math.sin(dLng / 2) ** 2;
  const dist = 2 * R * Math.asin(Math.sqrt(a));
  const mins = Math.max(1, Math.round(dist / 80));   // 按步行 80 米/分钟估算
  const km = dist >= 1000 ? (dist / 1000).toFixed(2) + ' 公里' : Math.round(dist) + ' 米';
  document.getElementById('routeSummary').textContent =
    `直线参考约 ${km} · 步行约 ${mins} 分钟 → ${currentPoi ? currentPoi.name : (notePanel ? '该备注位置' : '')}`;
  document.getElementById('routeSteps').innerHTML =
    '⚠ 当前为直线参考路线。<br>真实步行路线服务暂不可用（可能当日免费额度已用完，次日自动恢复），恢复后再点一次导航即可。';
  document.getElementById('routeInfo').style.display = 'block';
  map.easeTo({ bounds: boundsOf([from, to]) });
}

function boundsOf(points) {
  const bounds = new TMap.LatLngBounds();
  points.forEach(p => bounds.extend(p));
  return bounds;
}

function clearRoute(keep) {
  if (routePolyline) { routePolyline.setMap(null); routePolyline = null; }
  if (!keep) {
    if (startMarker) { startMarker.setMap(null); startMarker = null; }
    startPos = null;
    document.getElementById('routeInfo').style.display = 'none';
  }
}

function renderFloorSvg() {

    `<rect x="20" y="100" width="640" height="60" fill="#f5f0e1" stroke="#cbbf9a"/>`,
    `<text x="330" y="135" font-size="13" fill="#8a7d52" text-anchor="middle">走 廊</text>`,

    `<text x="50" y="214" font-size="11" fill="#5b6b87" text-anchor="middle">楼梯</text>`,
    `<rect x="600" y="180" width="60" height="60" fill="#e8edf4" stroke="#9aa8bf"/>`,
    `<text x="630" y="214" font-size="11" fill="#5b6b87" text-anchor="middle">楼梯</text>`,
  ];
  for (let i = 0; i < 5; i++) {
    const no = base + i + 1, x = 20 + i * 128;
    parts.push(`<g class="room" onclick="openRoom('1-${no}教室')">
      <rect x="${x + 2}" y="20" width="124" height="70" rx="4"/>
      <text x="${x + 64}" y="60" text-anchor="middle">1-${no}</text></g>`);
  }
  for (let i = 0; i < 5; i++) {
    const no = base + i + 6, x = 84 + i * 128;
    if (x + 126 > 600) break;
    parts.push(`<g class="room" onclick="openRoom('1-${no}教室')">
      <rect x="${x + 2}" y="170" width="124" height="70" rx="4"/>
      <text x="${x + 64}" y="210" text-anchor="middle">1-${no}</text></g>`);
  }
  document.getElementById('floorSvg').innerHTML = parts.join('');
}
function openRoom(name) {
  const id = roomIdMap[name];
  closeFloorModal();
  if (id) openDetail(id);
}

/* ---------- 数据装载 ---------- */
async function loadPois() {
  try {
    pois = await fetch(`${API}/pois`).then(r => r.json());
    document.getElementById('banner').classList.remove('show');
  } catch (e) {
    document.getElementById('banner').classList.add('show');
    return;
  }
  renderList();   // 地图不再默认铺满图标，改为选中地点时才点亮
}

async function loadStats() {
  try {
    const s = await fetch(`${API}/stats`).then(r => r.json());
    document.getElementById('subbar').innerHTML =
      `<span>地点 ${s.poi_count}</span>
       <span>评论 ${s.comment_count}</span>
       <span>备注 ${s.note_count}</span>
       <span>失物招领待处理 ${s.lostfound_open}</span>
       <span>论坛帖 ${s.post_count}</span>`;
  } catch (e) { /* 忽略 */ }
}

document.getElementById('searchInput').addEventListener('input', renderList);
renderHeader('map.html');
injectAuthModal();
initMap();
renderCats();
loadPois();
loadNotes();
loadStats();
</script>
